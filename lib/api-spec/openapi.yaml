openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Visa Explorer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: anthropic
    description: Anthropic AI chat operations
  - name: health
    description: Health operations
  - name: countries
    description: Country operations
  - name: visas
    description: Visa operations
  - name: auth
    description: Authentication operations
  - name: community
    description: Community features
  - name: users
    description: User profile operations
  - name: support
    description: Support cases
  - name: groups
    description: Travel groups with group chat
  - name: tracker
    description: Community visa application tracker
  - name: dm
    description: Private direct messages between users
paths:
  /api/admin/users/search:
    get:
      operationId: adminSearchUsers
      tags: [admin]
      summary: Search users by name or email (super admin only)
      security:
        - session: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search query (name or email)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated list of matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        "403":
          description: Forbidden

  /api/admin/users/{userId}:
    get:
      operationId: getAdminUserDetail
      tags: [admin]
      summary: Get full profile and activity stats for a user (super admin only)
      security:
        - session: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail with activity stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /api/admin/site-stats:
    get:
      operationId: getAdminSiteStats
      tags: [admin]
      summary: Get site-wide statistics (super admin only)
      security:
        - session: []
      responses:
        "200":
          description: Site statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
        "403":
          description: Forbidden

  /api/track:
    post:
      operationId: trackPageView
      tags: [admin]
      summary: Record a page view (anonymous, fire-and-forget)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackPageViewBody"
      responses:
        "204":
          description: Recorded

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: List all countries
      description: Returns a list of all countries with basic information
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by country name
        - name: continent
          in: query
          required: false
          schema:
            type: string
          description: Filter by continent
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"

  /countries/{code}:
    get:
      operationId: getCountry
      tags: [countries]
      summary: Get country details
      description: Returns detailed information about a country including all visas available for that destination
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: ISO 3166-1 alpha-2 country code
      responses:
        "200":
          description: Country detail with visas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryDetail"
        "404":
          description: Country not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /visas:
    get:
      operationId: listVisas
      tags: [visas]
      summary: List visas with filtering and sorting
      description: Returns a list of visas with optional filters for passport country, destination, type, fee range, etc.
      parameters:
        - name: passportCountry
          in: query
          required: false
          schema:
            type: string
          description: Filter by passport country code (e.g. US, IN, GB)
        - name: destinationCountry
          in: query
          required: false
          schema:
            type: string
          description: Filter by destination country code
        - name: visaType
          in: query
          required: false
          schema:
            type: string
          description: Filter by visa type (tourist, business, student, work, transit, digital_nomad)
        - name: entryType
          in: query
          required: false
          schema:
            type: string
          description: Filter by entry policy (visa_free, visa_on_arrival, evisa, visa_required)
        - name: continent
          in: query
          required: false
          schema:
            type: string
          description: Filter by destination continent
        - name: maxFee
          in: query
          required: false
          schema:
            type: number
          description: Maximum visa fee in USD
        - name: minDuration
          in: query
          required: false
          schema:
            type: integer
          description: Minimum stay duration in days
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
          description: Sort field (fee, duration, processingDays, country)
        - name: order
          in: query
          required: false
          schema:
            type: string
          description: Sort order (asc, desc)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max results to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: Pagination offset
      responses:
        "200":
          description: List of visas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaListResponse"

  /visas/{id}:
    get:
      operationId: getVisa
      tags: [visas]
      summary: Get visa details
      description: Returns detailed information about a specific visa including requirements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Visa ID
      responses:
        "200":
          description: Visa detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaDetail"
        "404":
          description: Visa not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /passport/destinations:
    get:
      operationId: listDestinationsByPassport
      tags: [visas]
      summary: Get all destinations for a passport
      description: Returns all countries and visa policies for a given passport country
      parameters:
        - name: passportCode
          in: query
          required: true
          schema:
            type: string
          description: Passport country code (e.g. US, IN, GB)
        - name: entryType
          in: query
          required: false
          schema:
            type: string
          description: Filter by entry type (visa_free, visa_on_arrival, evisa, visa_required)
        - name: continent
          in: query
          required: false
          schema:
            type: string
          description: Filter by destination continent
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
          description: Sort field (country, fee, duration)
        - name: order
          in: query
          required: false
          schema:
            type: string
          description: Sort order (asc, desc)
      responses:
        "200":
          description: Passport destinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassportDestinationsResponse"
        "404":
          description: Passport country not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /passport/rankings:
    get:
      operationId: getPassportRankings
      tags: [visas]
      summary: Get worldwide passport strength rankings
      description: Returns all countries ranked by passport strength (total accessible destinations)
      responses:
        "200":
          description: Ranked passport list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PassportRankEntry"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [visas]
      summary: Get global stats overview
      description: Returns aggregated statistics about visas and countries
      responses:
        "200":
          description: Global stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /auth/user:
    get:
      tags: [auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"

  /community/feed:
    get:
      tags: [community]
      operationId: getCommunityFeed
      summary: Get community activity feed
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedItem"

  /countries/{code}/reviews:
    get:
      tags: [community]
      operationId: getCountryReviews
      summary: Get reviews for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reviews list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsResponse"
    delete:
      tags: [community]
      operationId: deleteCountryReview
      summary: Delete the authenticated user's review for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found
    post:
      tags: [community]
      operationId: createCountryReview
      summary: Create or update a review for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          description: Unauthorized

  /countries/{code}/questions:
    get:
      tags: [community]
      operationId: getCountryQuestions
      summary: Get Q&A questions for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Questions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSummary"
    post:
      tags: [community]
      operationId: createCountryQuestion
      summary: Post a question about a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionBody"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSummary"
        "401":
          description: Unauthorized

  /questions/{id}/answers:
    get:
      tags: [community]
      operationId: getQuestionAnswers
      summary: Get answers for a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question with answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionWithAnswers"
    post:
      tags: [community]
      operationId: postAnswer
      summary: Post an answer to a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnswerBody"
      responses:
        "201":
          description: Answer posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "401":
          description: Unauthorized

  /questions:
    post:
      tags: [community]
      operationId: createQuestion
      summary: Post a question (specify countryCode in body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionWithCountryBody"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSummary"
        "401":
          description: Unauthorized

  /questions/{id}:
    delete:
      tags: [community]
      operationId: deleteQuestion
      summary: Delete a question (author only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    get:
      tags: [community]
      operationId: getQuestion
      summary: Get a question with full detail and answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionDetail"
        "404":
          description: Not found

  /questions/{id}/follow:
    post:
      tags: [community]
      operationId: toggleQuestionFollow
      summary: Toggle follow status on a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"
        "401":
          description: Unauthorized

  /answers/{id}:
    delete:
      tags: [community]
      operationId: deleteAnswer
      summary: Delete an answer (author only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /answers/{id}/replies:
    get:
      tags: [community]
      operationId: getAnswerReplies
      summary: Get replies to an answer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnswerReply"
    post:
      tags: [community]
      operationId: postAnswerReply
      summary: Reply to an answer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyBody"
      responses:
        "201":
          description: Reply posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerReply"
        "401":
          description: Unauthorized

  /answers/{id}/replies/{replyId}:
    delete:
      tags: [community]
      operationId: deleteAnswerReply
      summary: Delete a reply (author only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: replyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /users/me/followed-questions:
    get:
      tags: [users]
      operationId: getFollowedQuestions
      summary: Get questions the authenticated user follows
      responses:
        "200":
          description: Followed questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSummary"
        "401":
          description: Unauthorized

  /travel-map:
    get:
      tags: [community]
      operationId: getTravelMap
      summary: Get the authenticated user's travel map
      responses:
        "200":
          description: Travel entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TravelEntry"
        "401":
          description: Unauthorized

  /travel-map/{code}:
    put:
      tags: [community]
      operationId: upsertTravelEntry
      summary: Add or update a country in the travel map
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTravelEntryBody"
      responses:
        "200":
          description: Entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelEntry"
        "401":
          description: Unauthorized
    delete:
      tags: [community]
      operationId: deleteTravelEntry
      summary: Remove a country from the travel map
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Unauthorized

  /users/me:
    patch:
      tags: [users]
      operationId: updateMyProfile
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /users/me/activity:
    get:
      tags: [users]
      operationId: getMyActivity
      summary: Get the authenticated user's Q&A activity
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivity"
        "401":
          description: Unauthorized

  /countries/{code}/visa-reports:
    get:
      tags: [community]
      operationId: getVisaReports
      summary: Get community visa processing reports for a country
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: passportCode
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Visa reports and stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaReportsStats"
    post:
      tags: [community]
      operationId: submitVisaReport
      summary: Submit a visa application report
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVisaReportBody"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisaReportItem"
        "401":
          description: Unauthorized

  /support/cases:
    get:
      tags: [support]
      operationId: getMyCases
      summary: List the authenticated user's support cases
      responses:
        "200":
          description: List of support cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportCase"
        "401":
          description: Unauthorized
    post:
      tags: [support]
      operationId: createSupportCase
      summary: Raise a new support case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportCaseBody"
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCase"
        "401":
          description: Unauthorized

  /support/cases/{id}:
    get:
      tags: [support]
      operationId: getSupportCase
      summary: Get a support case with its comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Support case with comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCase"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /support/cases/{id}/comments:
    post:
      tags: [support]
      operationId: addSupportComment
      summary: Add a comment to a support case (admin can also update status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSupportCommentBody"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCaseComment"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ── Groups ────────────────────────────────────────────────────────────────
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all public groups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
